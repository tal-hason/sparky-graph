<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparky-Plex — Interactive Codebase Knowledge Graph (Graphify)</title>
<style>
  :root {
    --bg: #0b0b14; --header: #121222; --border: #252545;
    --text: #eaeaf5; --muted: #8b8ba7; --accent: #6366f1; --accent-hover: #818cf8;
    --badge-bg: #1c1c36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    height: 54px; background: var(--header); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; gap: 12px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .stats-pills { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .pill {
    background: var(--badge-bg); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .pill b { color: var(--text); }
  nav { display: flex; align-items: center; gap: 6px; }
  .tab-btn {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab-btn.active {
    color: #fff; background: rgba(99, 102, 241, 0.18);
    border-color: var(--accent);
  }
  .actions { display: flex; align-items: center; gap: 8px; }
  .action-link, .action-btn {
    color: var(--muted); text-decoration: none; font-size: 12px;
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--badge-bg); transition: all 0.15s ease; cursor: pointer;
    font-family: inherit;
  }
  .action-link:hover, .action-btn:hover { color: #fff; border-color: var(--accent); }
  main { flex: 1; position: relative; overflow: hidden; }
  iframe {
    width: 100%; height: 100%; border: none; display: none; background: #0f0f1a;
  }
  iframe.active { display: block; }
  @media (max-width: 820px) {
    .stats-pills { display: none; }
    header { height: auto; flex-wrap: wrap; padding: 8px 12px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Sparky-Plex Codebase Graph</span>
      <div class="stats-pills">
        <span class="pill"><b>878</b> nodes</span>
        <span class="pill"><b>1525</b> edges</span>
        <span class="pill"><b>70</b> communities</span>
        <span class="pill" title="Source commit & build timestamp"><code>6abe2a493a943cb2622f0fbd5f9bb13dd0828d89</code> · 2026-10-28 09:11 UTC</span>
      </div>
    </div>
    <nav role="tablist" aria-label="Graph Visualization Modes">
      <button class="tab-btn active" data-target="frame-graph" data-src="graph.html?v=1d4375ad" onclick="switchTab(this)">
        <span>Force Graph</span>
      </button>
      <button class="tab-btn" data-target="frame-callflow" data-src="callflow.html?v=1d4375ad" onclick="switchTab(this)">
        <span>Architecture &amp; Call-Flow</span>
      </button>
      <button class="tab-btn" data-target="frame-tree" data-src="tree.html?v=1d4375ad" onclick="switchTab(this)">
        <span>Hierarchy Tree</span>
      </button>
      <button class="tab-btn" data-target="frame-report" data-src="report.html?v=1d4375ad" onclick="switchTab(this)">
        <span>Graph Report</span>
      </button>
    </nav>
    <div class="actions">
      <button class="action-btn" id="toggle-sidebar-header-btn" onclick="toggleGraphSidebarFromHeader()" title="Collapse or expand Force Graph sidebar">Hide Sidebar</button>
      <a class="action-link" id="open-direct" href="graph.html?v=1d4375ad" target="_blank" rel="noopener">Open Fullscreen ↗</a>
      <a class="action-link" href="graph.json" target="_blank" rel="noopener">graph.json</a>
    </div>
  </header>
  <main>
    <iframe id="frame-graph" class="active" src="graph.html?v=1d4375ad" title="Interactive Force Graph"></iframe>
    <iframe id="frame-callflow" title="Mermaid Call-Flow Diagrams"></iframe>
    <iframe id="frame-tree" title="Collapsible Hierarchy Tree"></iframe>
    <iframe id="frame-report" title="Graph Report Summary"></iframe>
  </main>
  <script>
    function updateHeaderSidebarBtn(collapsed) {
      const sbBtn = document.getElementById('toggle-sidebar-header-btn');
      if (sbBtn) {
        sbBtn.textContent = collapsed ? 'Show Sidebar' : 'Hide Sidebar';
      }
    }
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'sidebar-state') {
        updateHeaderSidebarBtn(Boolean(e.data.collapsed));
      }
    });
    function toggleGraphSidebarFromHeader() {
      const frame = document.getElementById('frame-graph');
      if (!frame) return;
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument || (win && win.document);
        if (win && typeof win.toggleGraphSidebar === 'function') {
          const collapsed = win.toggleGraphSidebar();
          updateHeaderSidebarBtn(collapsed);
          return;
        }
        if (doc && doc.body) {
          const sb = doc.getElementById('sidebar');
          const next = !doc.body.classList.contains('sidebar-collapsed') && (!sb || sb.style.display !== 'none');
          doc.body.classList.toggle('sidebar-collapsed', next);
          if (sb) sb.style.display = next ? 'none' : 'flex';
          if (win && win.network && typeof win.network.redraw === 'function') {
            win.network.redraw();
          }
          updateHeaderSidebarBtn(next);
          return;
        }
        if (win) {
          win.postMessage({ type: 'toggle-sidebar' }, '*');
        }
      } catch (err) {
        if (frame.contentWindow) {
          frame.contentWindow.postMessage({ type: 'toggle-sidebar' }, '*');
        }
      }
    }
    function switchTab(btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      const targetId = btn.getAttribute('data-target');
      const src = btn.getAttribute('data-src');
      const frame = document.getElementById(targetId);
      if (!frame.getAttribute('src')) {
        frame.setAttribute('src', src);
      }
      frame.classList.add('active');
      document.getElementById('open-direct').setAttribute('href', src);
      const sbBtn = document.getElementById('toggle-sidebar-header-btn');
      if (sbBtn) {
        sbBtn.style.display = targetId === 'frame-graph' ? 'inline-block' : 'none';
      }
      history.replaceState(null, '', '#' + targetId.replace('frame-', ''));
    }
    window.addEventListener('DOMContentLoaded', () => {
      const hash = (location.hash || '').replace('#', '');
      if (hash) {
        const btn = document.querySelector(`.tab-btn[data-target="frame-${hash}"]`);
        if (btn) switchTab(btn);
      }
    });
  </script>
</body>
</html>
